[project]
name = "7scrum-doctor-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "supabase>=2.12,<3.0",
  "httpx>=0.27,<1.0",
  "python-dotenv>=1.0,<2.0",
  "tzdata>=2025.1,<2028",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
